[build]
  command = ""
  publish = "public"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[dev]
  publish = "public"
  framework = "#static"
  port = 8888
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[redirects]]
  from = "/coaching"
  to = "/start"
  status = 301
[[redirects]]
  from = "/coaching.html"
  to = "/start"
  status = 301
[[redirects]]
  from = "/apply"
  to = "/start"
  status = 301
[[redirects]]
  from = "/kit"
  to = "/free"
  status = 302
[[redirects]]
  from = "/notes/cost-of-waiting*"
  to = "/notes/savings-habit"
  status = 301
[[redirects]]
  from = "/notes/fixed-deposit-safe*"
  to = "/notes/before-investing"
  status = 301
